apiVersion: batch/v1
kind: CronJob
metadata:
  name: lecpac-rss-ingest
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingest-runner
              image: ghcr.io/your-org/lecpac-rss-ingest:latest
              command: ["python", "-m", "app.ingestion.cli", "ingest"]
              envFrom:
                - configMapRef:
                    name: lecpac-rss-config
                - secretRef:
                    name: lecpac-rss-secret
