apiVersion: batch/v1
kind: CronJob
metadata:
  name: lecpac-rss-ingest
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingest-runner
              image: ghcr.io/your-org/lecpac-rss-demo:latest
              command: ["python", "-c", "import asyncio\nfrom app.database import AsyncSessionLocal\nfrom app.config import get_settings\nfrom app.services.ingestion import ingest_feeds\nfrom app.services.embeddings import EmbeddingService\n\nasync def main():\n    async with AsyncSessionLocal() as db:\n        await ingest_feeds(db, get_settings().parsed_feeds, EmbeddingService())\n\nasyncio.run(main())"]
              envFrom:
                - configMapRef:
                    name: lecpac-rss-config
                - secretRef:
                    name: lecpac-rss-secret
