{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-ingest
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingest-runner
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command: ["python", "-c", "import asyncio\nfrom app.database import AsyncSessionLocal\nfrom app.config import get_settings\nfrom app.services.ingestion import ingest_feeds\nfrom app.services.embeddings import EmbeddingService\n\nasync def main():\n    async with AsyncSessionLocal() as db:\n        await ingest_feeds(db, get_settings().parsed_feeds, EmbeddingService())\n\nasyncio.run(main())"]
              envFrom:
                - configMapRef:
                    name: {{ .Release.Name }}-config
                - secretRef:
                    name: {{ .Values.secrets.existingSecret | default (printf "%s-secret" .Release.Name) }}
{{- end }}
