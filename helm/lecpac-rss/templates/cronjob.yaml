{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-ingest
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingest-runner
              image: "{{ .Values.image.ingest.repository }}:{{ .Values.image.ingest.tag }}"
              imagePullPolicy: {{ .Values.image.ingest.pullPolicy }}
              command: ["python", "-m", "app.ingestion.cli", "ingest"]
              envFrom:
                - configMapRef:
                    name: {{ .Release.Name }}-config
                - secretRef:
                    name: {{ .Values.secrets.existingSecret | default (printf "%s-secret" .Release.Name) }}
{{- end }}
